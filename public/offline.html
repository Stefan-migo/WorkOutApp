<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f8f4ed">
    <title>Baronda is offline</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 1.25rem; background: #f8f4ed; color: #29323c; font: 1rem/1.5 system-ui, sans-serif; }
      main { width: min(100%, 26rem); text-align: center; }
      img { display: block; margin: auto; border-radius: 1rem; }
      h1 { margin: .75rem 0; font-size: 1.75rem; }
      p { margin: 0 0 1.5rem; }
      a { display: inline-grid; place-items: center; min-height: 3rem; border-radius: .5rem; padding: 0 1.5rem; background: #93442f; color: #fffaf5; font-weight: 650; text-decoration: none; }
      a:focus-visible { outline: 2px solid #93442f; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/baronda-192.png" alt="" width="96" height="96">
      <h1>You’re offline</h1>
      <p>Reconnect to open your workouts, plan, and session history.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
